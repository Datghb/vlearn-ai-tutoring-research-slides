<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="description" content="VLearn AI Tutoring — 10-slide research presentation." />
    <title>VLearn AI Tutoring — Research Slides</title>
    <style>
      :root { color-scheme: light; --ink: #17231f; --muted: #68736d; --line: #dce1dc; --paper: #fff; --bg: #f3f1ec; --green: #1d5c48; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { min-height: 84px; padding: 18px clamp(20px, 5vw, 72px); display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.72); }
      .brand { display: flex; align-items: center; gap: 13px; }
      .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: var(--green); font-weight: 750; letter-spacing: -.04em; }
      .eyebrow { margin: 0 0 3px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
      .actions { display: flex; gap: 10px; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 15px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: white; font-size: 13px; font-weight: 650; text-decoration: none; }
      .button.primary { color: #fff; background: var(--green); border-color: var(--green); }
      main { width: min(1160px, calc(100% - 40px)); margin: 54px auto 64px; }
      .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
      h2 { margin: 0; font-size: clamp(26px, 4vw, 42px); line-height: 1.08; letter-spacing: -.045em; font-weight: 650; }
      .intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
      .count { flex: none; padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.65); color: var(--muted); font-size: 12px; }
      .viewer { height: min(74vh, 860px); min-height: 460px; overflow: hidden; border: 1px solid #d5d9d5; border-radius: 12px; background: #e6e8e5; box-shadow: 0 18px 50px rgba(23,35,31,.09); }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      footer { display: flex; justify-content: space-between; gap: 16px; padding: 18px 2px 0; color: var(--muted); font-size: 12px; }
      @media (max-width: 640px) { header { align-items: flex-start; } .brand { gap: 9px; } .mark { width: 34px; height: 34px; } h1 { max-width: 180px; font-size: 13px; } .actions .button { padding: 0 10px; font-size: 12px; } .actions .open { display: none; } main { margin-top: 34px; } .intro { align-items: flex-start; } .count { margin-top: 4px; } .viewer { min-height: 62vh; height: 68vh; border-radius: 8px; } footer { flex-direction: column; gap: 5px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">V</div>
        <div><p class="eyebrow">VLearn · Research</p><h1>AI Tutoring Research</h1></div>
      </div>
      <nav class="actions" aria-label="Slide actions">
        <a class="button open" href="slides.pdf" target="_blank" rel="noopener">Mở PDF riêng</a>
        <a class="button primary" href="slides.pdf" download>Tải xuống</a>
      </nav>
    </header>
    <main>
      <div class="intro">
        <div><h2>VLearn AI Tutoring</h2><p>Research presentation · 10 slides</p></div>
        <span class="count">10 trang</span>
      </div>
      <section class="viewer" aria-label="Bản trình bày VLearn AI Tutoring">
        <iframe src="slides.pdf#view=FitH" title="VLearn AI Tutoring research presentation"></iframe>
      </section>
      <footer><span>Cuộn hoặc dùng phím mũi tên để xem các trang.</span><span>VLearn AI Tutoring · Research</span></footer>
    </main>
  </body>
</html>
